apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: insta
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: sunaodisha/gateway-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: AUTH_URL
              value: "http://auth:8001"
            - name: USER_URL
              value: "http://user:8002"
            - name: POST_URL
              value: "http://post:8003"
            - name: COMMENT_URL
              value: "http://comment:8004"
            - name: LIKE_URL
              value: "http://like:8005"
            - name: FEED_URL
              value: "http://feed:8006"
            - name: NOTIFICATION_URL
              value: "http://notification:8007"

---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: insta
spec:
  selector:
    app: gateway
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
  type: NodePort

