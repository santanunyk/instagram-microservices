apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: insta
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: sunodisha/frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: insta
spec:
  type: ClusterIP       # ✔️ moved to correct place
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000

