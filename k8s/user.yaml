apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
  namespace: insta
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user
  template:
    metadata:
      labels:
        app: user
    spec:
      containers:
        - name: user
          image: sunaodisha/user-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8002
          env:
            - name: MONGO_URL
              value: "mongodb://mongodb:27017/instagramdb"
---
apiVersion: v1
kind: Service
metadata:
  name: user
  namespace: insta
spec:
  selector:
    app: user
  ports:
    - port: 8002
      targetPort: 8002

