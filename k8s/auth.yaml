apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: insta
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: sunaodisha/latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
          env:
            - name: MONGO_URL
              value: "mongodb://mongodb:27017/instagramdb"
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: insta
spec:
  selector:
    app: auth
  ports:
    - port: 8001
      targetPort: 8001

