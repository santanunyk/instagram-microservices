apiVersion: apps/v1
kind: Deployment
metadata:
  name: like
  namespace: insta
spec:
  replicas: 1
  selector:
    matchLabels:
      app: like
  template:
    metadata:
      labels:
        app: like
    spec:
      containers:
        - name: like
          image: like-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8005
          env:
            - name: MONGO_URL
              value: "mongodb://mongodb:27017/instagramdb"
---
apiVersion: v1
kind: Service
metadata:
  name: like
  namespace: insta
spec:
  selector:
    app: like
  ports:
    - port: 8005
      targetPort: 8005

