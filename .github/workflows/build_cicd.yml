name: Build & Deploy Microservices

on:
  push:
    branches:
      - main

jobs:
  # ---------------------------------------------------------
  # 1) CHECKOUT CODE
  # ---------------------------------------------------------
  checkout:
    runs-on: self-hosted
    outputs:
      changed_services: ${{ steps.detect.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # Detect which folders changed
      - name: Detect changed services
        id: detect
        run: |
          echo "🔍 Detecting modified services..."

          SERVICES=(
            "services/auth-service"
            "services/user-service"
            "services/post-service"
            "services/comment-service"
            "services/like-service"
            "services/feed-service"
            "services/notification-service"
            "services/gateway-service"
            "frontend"
          )

          CHANGED=""

          for folder in "${SERVICES[@]}"; do
            if git diff --name-only HEAD~1 HEAD | grep "^$folder/" >/dev/null; then
              svc_name=$(basename "$folder")
              CHANGED="$CHANGED $svc_name"
              echo "✅ Changed: $svc_name"
            fi
          done

          echo "changed=$CHANGED" >> $GITHUB_OUTPUT


  # ---------------------------------------------------------
  # 2) BUILD & PUSH ONLY UPDATED SERVICES
  # ---------------------------------------------------------
  build:
    needs: checkout
    if: ${{ needs.checkout.outputs.changed_services != '' }}
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set Docker Tags
        id: vars
        run: |
          echo "SHA_TAG=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build & Push Modified Services
        run: |
          CHANGED="${{ needs.checkout.outputs.changed_services }}"
          echo "Changed services: $CHANGED"

          for svc in $CHANGED; do
            echo "🚀 Building $svc ..."

            # Path logic
            if [ "$svc" = "frontend" ]; then
              PATH_TO="./frontend"
            else
              PATH_TO="./services/$svc"
            fi

            docker build -t sunaodisha/$svc:${{ steps.vars.outputs.SHA_TAG }} $PATH_TO
            docker tag sunaodisha/$svc:${{ steps.vars.outputs.SHA_TAG }} sunaodisha/$svc:latest

            docker push sunaodisha/$svc:${{ steps.vars.outputs.SHA_TAG }}
            docker push sunaodisha/$svc:latest

            echo "📦 Built & pushed $svc"
          done


  # ---------------------------------------------------------
  # 3) DEPLOY ONLY UPDATED SERVICES
  # ---------------------------------------------------------
  deploy:
    needs: build
    runs-on: self-hosted

    steps:
      - name: Apply Kubernetes Manifests
        run: kubectl apply -f k8s/

      - name: Restart deployments for updated services
        run: |
          CHANGED="${{ needs.checkout.outputs.changed_services }}"
          echo "Deploying updated services: $CHANGED"

          # SERVICE → DEPLOYMENT NAME MAPPING
          declare -A MAP=(
            ["auth-service"]="auth"
            ["user-service"]="user"
            ["post-service"]="post"
            ["comment-service"]="comment"
            ["like-service"]="like"
            ["feed-service"]="feed"
            ["notification-service"]="notification"
            ["gateway-service"]="gateway"
            ["frontend"]="frontend"
          )

          for svc in $CHANGED; do
            deployment="${MAP[$svc]}"
            echo "♻ Restarting deployment $deployment ..."
            kubectl rollout restart deployment/$deployment -n insta
          done

      - name: Verify Rollout
        run: kubectl get pods -n insta -o wide

