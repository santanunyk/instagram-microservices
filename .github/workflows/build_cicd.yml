name: Build & Deploy Microservices

on:
  push:
    branches:
      - main

jobs:

  # ---------------------------------------------------------
  # 1) CHECKOUT + DETECT CHANGES
  # ---------------------------------------------------------
  checkout:
    runs-on: self-hosted

    outputs:
      changed: ${{ steps.detect.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0   # IMPORTANT for diff

      - name: Detect changed services
        id: detect
        run: |
          echo "🔍 Detecting modified microservices..."

          BEFORE_SHA="${{ github.event.before }}"
          CURRENT_SHA="${{ github.sha }}"

          # Handle first push (before = null)
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BEFORE_SHA=$(git rev-list --max-parents=0 HEAD)
          fi

          echo "Comparing commits:"
          echo "FROM: $BEFORE_SHA"
          echo "TO:   $CURRENT_SHA"

          CHANGED_FILES=$(git diff --name-only $BEFORE_SHA $CURRENT_SHA)

          SERVICES=(
            "services/auth-service"
            "services/user-service"
            "services/post-service"
            "services/comment-service"
            "services/like-service"
            "services/feed-service"
            "services/notification-service"
            "services/gateway-service"
            "frontend"
          )

          CHANGED=""

          for FOLDER in "${SERVICES[@]}"; do
            if echo "$CHANGED_FILES" | grep "^$FOLDER/" >/dev/null; then
              NAME=$(basename $FOLDER)
              echo "✅ Changed: $NAME"
              CHANGED="$CHANGED $NAME"
            fi
          done

          echo "changed=$CHANGED" >> $GITHUB_OUTPUT
          echo "CHANGED SERVICES: $CHANGED"


  # ---------------------------------------------------------
  # 2) BUILD & PUSH DOCKER IMAGES
  # ---------------------------------------------------------
  build:
    needs: checkout
    if: ${{ needs.checkout.outputs.changed != '' }}   # Skip if nothing changed
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set build variables
        id: vars
        run: |
          echo "SHA_TAG=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build & Push Images
        run: |
          CHANGED="${{ needs.checkout.outputs.changed }}"
          echo "🚀 Building changed services: $CHANGED"

          for svc in $CHANGED; do
            echo "--------------------------------------------"
            echo "🔨 Building $svc"
            if [ "$svc" = "frontend" ]; then
              PATH_TO="./frontend"
            else
              PATH_TO="./services/$svc"
            fi

            docker build -t sunaodisha/$svc:${{ steps.vars.outputs.SHA_TAG }} $PATH_TO

            docker tag sunaodisha/$svc:${{ steps.vars.outputs.SHA_TAG }} sunaodisha/$svc:latest

            docker push sunaodisha/$svc:${{ steps.vars.outputs.SHA_TAG }}
            docker push sunaodisha/$svc:latest

            echo "📦 DONE: $svc"
            echo "--------------------------------------------"
          done


  # ---------------------------------------------------------
  # 3) DEPLOY TO KUBERNETES
  # ---------------------------------------------------------
  deploy:
    needs: build
    runs-on: self-hosted
    if: ${{ needs.checkout.outputs.changed != '' }}

    steps:
      - name: Apply Kubernetes manifests
        run: kubectl apply -f k8s/

      - name: Restart updated services
        run: |
          CHANGED="${{ needs.checkout.outputs.changed }}"
          echo "♻ Restarting deployments: $CHANGED"

          for svc in $CHANGED; do
            echo "Restarting: $svc"
            kubectl rollout restart deployment/$svc -n insta
          done

      - name: Verify rollout
        run: kubectl get pods -n insta -o wide

