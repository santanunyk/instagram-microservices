name: Build & Deploy Microservices (Stage-Based)

on:
  push:
    branches:
      - main

jobs:

################################################################################
#                               STAGE 1: CHECKOUT
################################################################################
  checkout:
    runs-on: self-hosted
    outputs:
      tag: ${{ steps.vars.outputs.TAG }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set Image Tag
        id: vars
        run: echo "TAG=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

################################################################################
#                       STAGE 2: BUILD DOCKER IMAGES
################################################################################
  build:
    needs: checkout
    runs-on: self-hosted
    outputs:
      tag: ${{ needs.checkout.outputs.tag }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Build Microservice Images
        run: |
          TAG="${{ needs.checkout.outputs.tag }}"

          SERVICES=(
            "auth-service"
            "user-service"
            "post-service"
            "comment-service"
            "like-service"
            "feed-service"
            "notification-service"
            "gateway-service"
          )

          for svc in "${SERVICES[@]}"; do
            echo "🔨 Building $svc image..."
            docker build -t sunaodisha/$svc:$TAG ./services/$svc
            docker build -t sunaodisha/$svc:latest ./services/$svc
          done

          echo "🔨 Building frontend image..."
          docker build -t sunaodisha/frontend:$TAG ./frontend
          docker build -t sunaodisha/frontend:latest ./frontend

################################################################################
#                       STAGE 3: PUSH IMAGES TO DOCKER HUB
################################################################################
  push:
    needs: build
    runs-on: self-hosted
    outputs:
      tag: ${{ needs.build.outputs.tag }}

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Push Microservice Images
        run: |
          TAG="${{ needs.build.outputs.tag }}"

          SERVICES=(
            "auth-service"
            "user-service"
            "post-service"
            "comment-service"
            "like-service"
            "feed-service"
            "notification-service"
            "gateway-service"
          )

          for svc in "${SERVICES[@]}"; do
            echo "📤 Pushing $svc..."
            docker push sunaodisha/$svc:$TAG
            docker push sunaodisha/$svc:latest
          done

          echo "📤 Pushing frontend..."
          docker push sunaodisha/frontend:$TAG
          docker push sunaodisha/frontend:latest

################################################################################
#                       STAGE 4: APPLY KUBERNETES MANIFESTS
################################################################################
  deploy:
    needs: push
    runs-on: self-hosted
    outputs:
      tag: ${{ needs.push.outputs.tag }}

    steps:
      - name: Apply Kubernetes Manifests
        run: kubectl apply -f k8s/ -n insta

################################################################################
#                       STAGE 5: ROLLOUT RESTART DEPLOYMENTS
################################################################################
  restart:
    needs: deploy
    runs-on: self-hosted

    steps:
      - name: Restart Microservice Deployments
        run: |
          DEPLOYMENTS=(
            "auth"
            "user"
            "post"
            "comment"
            "like"
            "feed"
            "notification"
            "gateway"
            "frontend"
          )

          for dep in "${DEPLOYMENTS[@]}"; do
            echo "♻ Restarting $dep..."
            kubectl rollout restart deployment/$dep -n insta
          done

################################################################################
#                       STAGE 6: VERIFY FINAL DEPLOYMENT
################################################################################
  verify:
    needs: restart
    runs-on: self-hosted

    steps:
      - name: Verify Pods
        run: kubectl get pods -n insta -o wide

