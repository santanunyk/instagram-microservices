name: Build & Deploy Microservices

on:
  push:
    branches: [ main ]

jobs:

  checkout:
    runs-on: self-hosted
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: detect
        run: |
          echo "Detecting modified folders..."

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE=$(git rev-list --max-parents=0 HEAD)
          fi

          CHANGED_FILES=$(git diff --name-only $BEFORE $AFTER)

          # IF WORKFLOW CHANGED → FORCE BUILD ALL
          if echo "$CHANGED_FILES" | grep "^.github/workflows/" >/dev/null; then
            echo "changed=ALL" >> $GITHUB_OUTPUT
            exit 0
          fi

          SERVICES=(
            "services/auth-service"
            "services/user-service"
            "services/post-service"
            "services/comment-service"
            "services/like-service"
            "services/feed-service"
            "services/notification-service"
            "services/gateway-service"
            "frontend"
          )

          CHANGED_LIST=""

          for FOLDER in "${SERVICES[@]}"; do
            if echo "$CHANGED_FILES" | grep "^$FOLDER/" >/dev/null; then
              CHANGED_LIST="$CHANGED_LIST $(basename $FOLDER)"
            fi
          done

          echo "changed=$CHANGED_LIST" >> $GITHUB_OUTPUT
  build:
    needs: checkout
    runs-on: self-hosted
    if: ${{ needs.checkout.outputs.changed != '' }}
    steps:
      - uses: actions/checkout@v3

      - id: vars
        run: echo "TAG=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build & push Docker images
        run: |
          CHANGED="${{ needs.checkout.outputs.changed }}"

          if [ "$CHANGED" = "ALL" ]; then
            echo "Building ALL services..."
            CHANGED="auth-service user-service post-service comment-service like-service feed-service notification-service gateway-service frontend"
          fi

          for svc in $CHANGED; do
            echo "Building $svc ..."
            if [ "$svc" = "frontend" ]; then
              PATH="./frontend"
            else
              PATH="./services/$svc"
            fi

            docker build -t sunaodisha/$svc:${{ steps.vars.outputs.TAG }} $PATH
            docker tag sunaodisha/$svc:${{ steps.vars.outputs.TAG }} sunaodisha/$svc:latest
            docker push sunaodisha/$svc:${{ steps.vars.outputs.TAG }}
            docker push sunaodisha/$svc:latest
          done
  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - run: kubectl apply -f k8s/

      - name: Restart deployments
        run: |
          CHANGED="${{ needs.checkout.outputs.changed }}"

          if [ "$CHANGED" = "ALL" ]; then
            CHANGED="auth user post comment like feed notification gateway frontend"
          fi

          for svc in $CHANGED; do
            kubectl rollout restart deployment/$svc -n insta
          done

      - run: kubectl get pods -n insta -o wide

