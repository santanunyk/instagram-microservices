name: Build & Deploy Microservices

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # Generate a unique image tag based on commit sha
      - name: Set Image Tag
        id: vars
        run: echo "TAG=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # Build & Push All Services
      - name: Build & Push Microservices
        run: |
          SERVICES=(
            "auth-service"
            "user-service"
            "post-service"
            "comment-service"
            "like-service"
            "feed-service"
            "notification-service"
            "gateway-service"
          )

          for svc in "${SERVICES[@]}"; do
            echo "🚀 Building $svc ..."
            docker build -t sunaodisha/$svc:${{ steps.vars.outputs.TAG }} ./services/$svc
            docker push sunaodisha/$svc:${{ steps.vars.outputs.TAG }}
          done

          echo "🚀 Building frontend ..."
          docker build -t sunaodisha/frontend:${{ steps.vars.outputs.TAG }} ./frontend
          docker push sunaodisha/frontend:${{ steps.vars.outputs.TAG }}

      # Print Result
      - name: Print Generated Tag
        run: |
          echo "Images built & pushed with tag: ${{ steps.vars.outputs.TAG }}"

  deploy:
    needs: build
    runs-on: self-hosted

    steps:
      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -f k8s/

      - name: Restart Microservice Deployments
        run: |
          DEPLOYMENTS=(
            "auth"
            "user"
            "post"
            "comment"
            "like"
            "feed"
            "notification"
            "gateway"
            "frontend"
          )

          for dep in "${DEPLOYMENTS[@]}"; do
            echo "♻ Rolling out $dep ..."
            kubectl rollout restart deployment/$dep
          done

      - name: Verify Rollout
        run: kubectl get pods -o wide

